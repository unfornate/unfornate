<!doctype html>
<html lang="ru">

  <meta charset="utf-8">

  <link rel="stylesheet" href="css/base.css">

<body>
  <aside class="sidebar">

        <table id="tbl-pnl">
          <thead><tr></tr></thead>
          <tbody></tbody>
        </table>
      </div>

    </section>

  <script src="js/core.js"></script>
